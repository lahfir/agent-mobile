name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Source rules (400 lines per file, no inline comments, docs <= 15 lines)
        run: |
          python3 scripts/check_rust_comments_test.py
          scripts/check-rust-source.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
          command-arguments: advisories licenses bans sources

  simulator-integration:
    name: Simulator integration
    needs: lint-and-test
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Pick and boot the simulator, outside the boot budget
        run: |
          selection="$(scripts/ci-pick-simulator.sh)"
          printf '%s\n' "$selection" >> "$GITHUB_ENV"
          sim_udid="$(printf '%s\n' "$selection" | sed -n 's/^SIM_UDID=//p')"
          sim_name="$(printf '%s\n' "$selection" | sed -n 's/^SIM_NAME=//p')"
          sim_runtime="$(printf '%s\n' "$selection" | sed -n 's/^SIM_RUNTIME=//p')"
          test -n "$sim_udid"
          echo "picked $sim_name on $sim_runtime"
          xcrun simctl boot "$sim_udid" || true
          xcrun simctl bootstatus "$sim_udid" -b || true

      - name: Cache the built driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: drivers/ios/dd
          key: driver-${{ runner.os }}-${{ env.SIM_RUNTIME }}-${{ hashFiles('drivers/ios/**/*.swift', 'drivers/ios/**/project.pbxproj') }}

      - name: Build the driver for that runtime, outside the boot budget
        run: |
          xcodebuild build-for-testing \
            -project drivers/ios/AgentMobileDriver.xcodeproj \
            -scheme AgentMobileDriver \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath drivers/ios/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Live simulator gate (one real boot, one real snapshot)
        env:
          AGENT_MOBILE_DRIVER_DIR: ${{ github.workspace }}/drivers/ios/dd/Build/Products
          AGENT_MOBILE_BOOT_BUDGET_SECS: "600"
        run: cargo test --test integration_snapshot --locked -- --ignored

      - name: Driver log on failure
        if: failure()
        run: |
          find "${TMPDIR:-/tmp}" -name 'driver-*.log' -mmin -40 -print -exec cat {} \; 2>/dev/null | head -300

  android-emulator:
    name: Android emulator
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - name: Android SDK locations
        run: |
          {
            echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk"
            echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk"
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd"
          } >> "$GITHUB_ENV"
      - name: JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Android SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('scripts/setup-android-sdk.sh') }}
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('drivers/android/**/*.gradle*', 'drivers/android/gradle/wrapper/*', 'drivers/android/**/gradle.lockfile') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-
      - name: KVM
        run: |
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -w /dev/kvm
      - name: Headless Android SDK
        run: |
          scripts/setup-android-sdk.sh
          scripts/setup-android-sdk.sh --check
      - name: Android driver build and unit tests
        run: drivers/android/gradlew -p drivers/android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Boot emulator (headless)
        id: boot
        run: scripts/ci-boot-android-emulator.sh start >> "$GITHUB_ENV"
      - name: Public CLI integration gate
        env:
          AGENT_MOBILE_ANDROID_APK: ${{ github.workspace }}/drivers/android/app/build/outputs/apk/debug/app-debug.apk
          AGENT_MOBILE_BOOT_BUDGET_SECS: "600"
        run: cargo test --test integration_android --locked -- --ignored --nocapture
      - name: Diagnostics on failure
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: scripts/ci-boot-android-emulator.sh diagnostics
      - name: Teardown emulator
        if: ${{ always() && steps.boot.outcome != 'skipped' }}
        env:
          CI_ANDROID_DELETE_AVD: "1"
        run: scripts/ci-boot-android-emulator.sh stop
