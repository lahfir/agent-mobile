name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Source rules (400 lines per file, no inline comments, docs <= 15 lines)
        run: |
          python3 scripts/check_rust_comments_test.py
          scripts/check-rust-source.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
          command-arguments: advisories licenses bans sources

  simulator-integration:
    name: Simulator integration
    needs: lint-and-test
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Cache the built driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: drivers/ios/dd
          key: driver-${{ runner.os }}-${{ hashFiles('drivers/ios/**/*.swift', 'drivers/ios/**/project.pbxproj') }}

      - name: Build the driver, outside the boot budget
        run: |
          xcodebuild build-for-testing \
            -project drivers/ios/AgentMobileDriver.xcodeproj \
            -scheme AgentMobileDriver \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath drivers/ios/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Live simulator gate (one real boot, one real snapshot)
        env:
          AGENT_MOBILE_DRIVER_DIR: ${{ github.workspace }}/drivers/ios/dd/Build/Products
        run: cargo test --test integration_snapshot --locked -- --ignored

      - name: Driver log on failure
        if: failure()
        run: |
          find "${TMPDIR:-/tmp}" -name 'driver-*.log' -mmin -40 -print -exec cat {} \; 2>/dev/null | head -300
